{% load i18n %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'project_list' %}">{% trans "Projects Management" %} </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'project_list' %}">{% trans "Home" %}</a>
        </li>
        
      </ul>
      {% if user.is_authenticated %}
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-light" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            {{user.username}}
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">{% trans "Profile" %}</a></li>
            <li><hr class="dropdown-divider"></li>
            
             <li>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="dropdown-item">{% trans 'Logout' %}</button>
              </form>
            </li>

          </ul>
        </li>
      <form method="GET" action="{% url 'project_list' %}" class="d-flex ">
        <div class="input-group">
          
          <input type="text" name='q'
           placeholder="{% trans 'Search' %}" 
           value="{{ request.GET.q}}"
           class="form-control"/>

          <button class="btn btn-outline-light">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>
      {% endif%}
    </div>
  </div>
</nav>
