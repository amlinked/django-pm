{% load i18n %}
{% block content %}
    <h3>{% trans 'Project List' %}</h3>
    <ul>
        {%for project in object_list %}
            <li> {{ project.title }} , <a href="{% url 'project_update' project.id %}">Update</a> </li>
        {% empty %}
            <li>{% trans 'Thera are no Project to show' %} </li>
        {% endfor %}
    </ul>
{% endblock %}
